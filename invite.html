<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 청첩장</title>
<meta name="description" content="모바일 청첩장입니다.">
<meta property="og:title" content="모바일 청첩장">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf5ee;
    --paper: #fffdfa;
    --panel: #ffffff;
    --panel-2: #fbeee1;
    --border: #ecdfce;
    --text: #4a3f33;
    --muted: #a5967e;
    --accent: #e0795c;
    --accent-soft: #f6d9c9;
    --radius: 18px;
    --font-head: 'Gowun Batang', 'Nanum Myeongjo', serif;
    --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(circle, rgba(224,121,92,0.10) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color: var(--text); font-family: var(--font-body);
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 460px; background: var(--paper); min-height: 100vh;
    box-shadow: 0 0 60px rgba(74,63,51,0.08); padding-bottom: 60px; overflow: hidden;
  }
  .pad { padding: 0 30px; }

  .kicker { font-size: 0.78rem; letter-spacing: 0.18em; color: var(--muted); font-weight: 700; margin-bottom: 18px; }
  .names { font-family: var(--font-head); font-size: 2.1rem; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }
  .names .heart { color: var(--accent); font-size: 1.4rem; margin: 0 8px; }
  .date-line { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
  .venue-line { font-size: 0.9rem; color: var(--muted); }
  .hero { text-align: center; margin-bottom: 40px; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 34px 0; color: var(--accent-soft); font-size: 0.9rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .dday-box { text-align: center; background: var(--panel-2); border-radius: var(--radius); padding: 18px; margin-bottom: 34px; }
  .dday-box .num { font-family: var(--font-head); font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .dday-box .label { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

  .greeting { text-align: center; font-size: 0.98rem; line-height: 2; margin-bottom: 8px; white-space: pre-line; }

  section.block { margin-bottom: 34px; }
  .block-title { font-family: var(--font-head); font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 16px; }

  .info-card { background: var(--panel); border: 2px solid var(--border); border-radius: var(--radius); padding: 22px 20px; text-align: center; }
  .info-card .venue-name { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
  .info-card .venue-detail { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

  .map-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .map-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2);
    border: 2px solid var(--border); border-radius: 999px; padding: 9px 16px;
    font-size: 0.85rem; font-weight: 700; color: var(--text); text-decoration: none;
  }
  .map-btn:hover { border-color: var(--accent); color: var(--accent); }

  .account-note {
    background: var(--panel); border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 20px; text-align: center; color: var(--muted); font-size: 0.88rem; line-height: 1.7;
    white-space: pre-line;
  }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; }
  footer .heart { color: var(--accent); }

  /* classic layout: single portrait photo under names */
  .classic-photo {
    width: 200px; height: 200px; border-radius: 50%; object-fit: cover;
    margin: 0 auto 20px; display: block; border: 4px solid var(--panel);
    box-shadow: 0 8px 24px rgba(74,63,51,0.15);
  }

  /* cover layout: full-bleed hero image with overlaid names */
  .cover-hero { position: relative; width: 100%; aspect-ratio: 4/5; overflow: hidden; margin-bottom: 32px; }
  .cover-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(20,14,8,0.75) 100%);
  }
  .cover-hero .cover-text {
    position: absolute; left: 0; right: 0; bottom: 24px; z-index: 1; text-align: center; color: #fff;
  }
  .cover-hero .cover-text .kicker { color: rgba(255,255,255,0.85); }
  .cover-hero .cover-text .names { color: #fff; margin-bottom: 6px; }
  .cover-hero .cover-text .date-line, .cover-hero .cover-text .venue-line { color: rgba(255,255,255,0.9); }

  /* gallery layout: grid of photos */
  .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
  .gallery-grid .wide { grid-column: 1 / -1; aspect-ratio: 16/10; }

  /* polaroid layout */
  .polaroid-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 10px; padding: 10px 0 6px; }
  .polaroid-item {
    background: #fff; padding: 10px 10px 26px; box-shadow: 0 6px 16px rgba(74,63,51,0.18);
    width: 42%; transform: rotate(var(--r, -3deg));
  }
  .polaroid-item:nth-child(2n) { --r: 3deg; }
  .polaroid-item:nth-child(3n) { --r: -5deg; }
  .polaroid-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }

  /* minimal layout */
  .minimal-hero { text-align: center; margin-bottom: 44px; padding-top: 20px; }
  .minimal-hero .names { font-size: 1.7rem; }
  .minimal-hero .names .heart { display: block; margin: 10px 0; font-size: 1rem; }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const DEFAULT_INVITE = {
  groom: '양희범', bride: '김소진', date: '2027-02-27', time: '13:30',
  venue: '여의도 더 파티움',
  greeting: '두 사람이 하나의 마음으로 만나\n새로운 시작을 앞두고 있습니다.\n\n저희 두 사람의 첫 걸음을\n축복해 주시면 감사하겠습니다.',
  accountNote: '계좌번호는 추후 업데이트될 예정입니다.\n참석해 주시는 것만으로 큰 힘이 됩니다 🙏',
  layout: 'classic',
  photos: [],
};

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c !== null && c !== undefined) e.append(c);
  return e;
}

function photoUrl(slot) { return `/.netlify/functions/invite-photo?slot=${encodeURIComponent(slot)}`; }

function photoImg(slot, cls) {
  const img = el('img', { src: photoUrl(slot), alt: '', class: cls });
  img.onerror = () => { img.style.display = 'none'; };
  return img;
}

function heroBlock(data, opts) {
  opts = opts || {};
  return el('div', { class: opts.cls || 'hero' }, [
    el('div', { class: 'kicker' }, 'WE ARE GETTING MARRIED'),
    el('div', { class: 'names' }, [
      data.groom, el('span', { class: 'heart' }, opts.minimal ? '&' : '♥'), data.bride,
    ]),
    el('div', { class: 'date-line' }, formatDateLine(data)),
    el('div', { class: 'venue-line' }, data.venue),
  ]);
}

function formatDateLine(data) {
  try {
    const d = new Date(`${data.date}T${data.time || '00:00'}:00+09:00`);
    const weekday = d.toLocaleDateString('ko-KR', { weekday: 'long' });
    const [y, m, day] = data.date.split('-');
    const [hh, mm] = (data.time || '00:00').split(':').map(Number);
    const period = hh < 12 ? '오전' : '오후';
    const hour12 = hh % 12 === 0 ? 12 : hh % 12;
    return `${y}년 ${Number(m)}월 ${Number(day)}일 ${weekday} ${period} ${hour12}시${mm ? ' ' + mm + '분' : ''}`;
  } catch (e) {
    return data.date || '';
  }
}

function ddayBox(data) {
  const box = el('div', { class: 'dday-box' }, [
    el('div', { class: 'num' }, 'D-day'),
    el('div', { class: 'label' }, `${data.groom} ❤️ ${data.bride}의 결혼식이 다가옵니다`),
  ]);
  try {
    const d = new Date(`${data.date}T${data.time || '00:00'}:00+09:00`);
    const diff = Math.ceil((d - new Date()) / (1000 * 60 * 60 * 24));
    box.querySelector('.num').textContent = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day' : `결혼 후 ${Math.abs(diff)}일`;
  } catch (e) {}
  return box;
}

function greetingBlock(data) {
  return el('div', { class: 'greeting' }, data.greeting || '');
}

function mapSection(data) {
  const q = encodeURIComponent(data.venue || '');
  return el('section', { class: 'block' }, [
    el('div', { class: 'block-title' }, '오시는 길'),
    el('div', { class: 'info-card' }, [
      el('div', { class: 'venue-name' }, data.venue || ''),
      el('div', { class: 'venue-detail' }, formatDateLine(data)),
      el('div', { class: 'map-links' }, [
        el('a', { class: 'map-btn', href: `https://map.naver.com/p/search/${q}`, target: '_blank', rel: 'noopener' }, '🗺️ 네이버 지도'),
        el('a', { class: 'map-btn', href: `https://map.kakao.com/link/search/${q}`, target: '_blank', rel: 'noopener' }, '🚗 카카오맵'),
      ]),
    ]),
  ]);
}

function accountSection(data) {
  return el('section', { class: 'block' }, [
    el('div', { class: 'block-title' }, '마음 전하실 곳'),
    el('div', { class: 'account-note' }, data.accountNote || ''),
  ]);
}

function footerBlock(data) {
  return el('footer', {}, [data.groom, ' ', el('span', { class: 'heart' }, '·'), ' ', data.bride, ' ', el('span', { class: 'heart' }, '♥')]);
}

function buildClassic(data) {
  const pad = el('div', { class: 'pad' });
  pad.append(heroBlock(data));
  if (data.photos && data.photos[0]) {
    pad.querySelector('.hero').prepend(photoImg(data.photos[0], 'classic-photo'));
  }
  pad.append(ddayBox(data));
  pad.append(greetingBlock(data));
  pad.append(el('div', { class: 'divider' }, '❈'));
  pad.append(mapSection(data));
  pad.append(accountSection(data));
  pad.append(footerBlock(data));
  return pad;
}

function buildCover(data) {
  const root = document.createDocumentFragment();
  if (data.photos && data.photos[0]) {
    const hero = el('div', { class: 'cover-hero' }, [
      photoImg(data.photos[0], ''),
      heroBlock(data, { cls: 'cover-text' }),
    ]);
    root.append(hero);
    const pad = el('div', { class: 'pad' });
    pad.append(ddayBox(data));
    pad.append(greetingBlock(data));
    pad.append(el('div', { class: 'divider' }, '❈'));
    pad.append(mapSection(data));
    pad.append(accountSection(data));
    pad.append(footerBlock(data));
    root.append(pad);
    return root;
  }
  // no photo — fall back to classic-style header
  return buildClassic(data);
}

function buildGallery(data) {
  const pad = el('div', { class: 'pad' });
  pad.append(heroBlock(data));
  pad.append(ddayBox(data));
  pad.append(greetingBlock(data));
  const photos = data.photos || [];
  if (photos.length) {
    const grid = el('div', { class: 'gallery-grid' },
      photos.map((slot, i) => photoImg(slot, i === 0 && photos.length % 2 === 1 ? 'wide' : '')));
    pad.append(el('section', { class: 'block' }, [el('div', { class: 'block-title' }, '우리의 순간'), grid]));
  }
  pad.append(el('div', { class: 'divider' }, '❈'));
  pad.append(mapSection(data));
  pad.append(accountSection(data));
  pad.append(footerBlock(data));
  return pad;
}

function buildPolaroid(data) {
  const pad = el('div', { class: 'pad' });
  pad.append(heroBlock(data));
  pad.append(ddayBox(data));
  const photos = data.photos || [];
  if (photos.length) {
    const grid = el('div', { class: 'polaroid-grid' },
      photos.map(slot => el('div', { class: 'polaroid-item' }, photoImg(slot, ''))));
    pad.append(grid);
  }
  pad.append(greetingBlock(data));
  pad.append(el('div', { class: 'divider' }, '❈'));
  pad.append(mapSection(data));
  pad.append(accountSection(data));
  pad.append(footerBlock(data));
  return pad;
}

function buildMinimal(data) {
  const pad = el('div', { class: 'pad' });
  pad.append(heroBlock(data, { cls: 'minimal-hero hero', minimal: true }));
  pad.append(ddayBox(data));
  pad.append(greetingBlock(data));
  pad.append(el('div', { class: 'divider' }, '❈'));
  pad.append(mapSection(data));
  pad.append(accountSection(data));
  pad.append(footerBlock(data));
  return pad;
}

const BUILDERS = { classic: buildClassic, cover: buildCover, gallery: buildGallery, polaroid: buildPolaroid, minimal: buildMinimal };

function render(data) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const build = BUILDERS[data.layout] || buildClassic;
  app.append(build(data));
  document.title = `${data.groom} ♥ ${data.bride} 결혼합니다`;
}

render(DEFAULT_INVITE);

fetch('/.netlify/functions/invite')
  .then(res => res.ok ? res.json() : null)
  .then(json => {
    if (json && json.data) render({ ...DEFAULT_INVITE, ...json.data });
  })
  .catch(() => {});
</script>
</body>
</html>
