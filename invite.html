<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 청첩장</title>
<meta name="description" content="모바일 청첩장입니다.">
<meta property="og:title" content="모바일 청첩장">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="/invite-render.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(circle, rgba(224,121,92,0.10) 1px, transparent 1px) 0 0/22px 22px,
      #faf5ee;
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 460px; min-height: 100vh;
    box-shadow: 0 0 60px rgba(74,63,51,0.08); padding-bottom: 60px; overflow: hidden;
  }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
function render(data) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.append(InviteRender.buildInviteCard(data, { editable: false }));
  document.title = `${data.groom} ♥ ${data.bride} 결혼합니다`;
}

render(InviteRender.DEFAULT_INVITE);

fetch('/.netlify/functions/invite')
  .then(res => res.ok ? res.json() : null)
  .then(json => {
    if (json && json.data) render({ ...InviteRender.DEFAULT_INVITE, ...json.data });
  })
  .catch(() => {});
</script>
</body>
</html>
