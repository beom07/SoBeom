<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상견례 자료</title>
<meta name="description" content="상견례 자료입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sg-paper: #fffdfa; --sg-panel: #ffffff; --sg-panel-2: #fbeee1; --sg-border: #ecdfce;
    --sg-text: #4a3f33; --sg-muted: #a5967e; --sg-accent: #e0795c;
    --sg-font: 'Nanum Myeongjo', serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--sg-paper); color: var(--sg-text);
    font-family: var(--sg-font); display: flex; justify-content: center;
  }
  .card { width: 100%; max-width: 460px; min-height: 100vh; padding-bottom: 50px; }
  .intro {
    text-align: center; font-size: 0.98rem; line-height: 1.9; color: var(--sg-text);
    white-space: pre-line; padding: 44px 30px 34px;
  }
  .empty { text-align: center; color: var(--sg-muted); padding: 60px 30px; font-size: 0.9rem; }

  .slideshow { position: relative; width: 100%; aspect-ratio: 4/5; overflow: hidden; background: var(--sg-panel-2); }
  .slide-track { display: flex; height: 100%; transition: transform .45s cubic-bezier(.4,0,.2,1); }
  .slide { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .slide.text-slide { background: var(--sg-panel); padding: 40px; }
  .slide.text-slide .slide-text {
    font-size: 1.1rem; line-height: 2; text-align: center; white-space: pre-line; color: var(--sg-text);
  }
  .slide-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.85); border: none; font-size: 1.4rem; cursor: pointer; color: var(--sg-text);
    display: flex; align-items: center; justify-content: center;
  }
  .slide-nav.prev { left: 12px; }
  .slide-nav.next { right: 12px; }
  .slide-nav[disabled] { opacity: 0.3; cursor: default; }
  .slide-counter {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.45); color: #fff; font-size: 0.75rem; padding: 4px 12px; border-radius: 999px;
  }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: default; border-radius: 4px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 1.1rem; cursor: pointer;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.28); }

  /* envelope intro: wax-seal cover, opens like a real flap (3D rotate on its
     top edge) to reveal the intro text + slideshow already rendered beneath */
  .sg-envelope-perspective { position: fixed; inset: 0; z-index: 500; perspective: 1400px; }
  .sg-envelope-overlay {
    position: absolute; inset: 0; overflow: hidden; cursor: pointer;
    background: var(--sg-paper); display: flex; align-items: center; justify-content: center;
    transform-origin: top center; transform-style: preserve-3d;
    transition: transform .85s cubic-bezier(.5,0,.15,1), opacity .6s ease .18s;
  }
  .sg-envelope-overlay.sg-env-opening { transform: rotateX(-112deg) translateY(-3%) scale(0.98); opacity: 0; }
  .sg-env-fold { position: absolute; inset: 0; pointer-events: none; }
  .sg-env-fold::before, .sg-env-fold::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 200vmax; height: 1px; background: var(--sg-border);
  }
  .sg-env-fold::before { transform: translate(-50%, -50%) rotate(45deg); }
  .sg-env-fold::after { transform: translate(-50%, -50%) rotate(-45deg); }
  .sg-env-seal {
    position: relative; z-index: 2; width: 84px; height: 84px; border-radius: 50%; border: none; padding: 0;
    background: var(--sg-accent);
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--sg-accent) 80%, white), var(--sg-accent) 55%, color-mix(in srgb, var(--sg-accent) 60%, black) 100%);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.7rem;
    box-shadow: 0 6px 18px rgba(0,0,0,0.22), inset 0 2px 4px rgba(255,255,255,0.35); cursor: pointer;
  }
  .sg-env-hint {
    position: absolute; top: calc(50% + 68px); left: 50%; transform: translateX(-50%);
    font-size: 0.72rem; color: var(--sg-muted); letter-spacing: 0.15em; z-index: 2;
  }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children || [])) if (c !== null && c !== undefined) e.append(c);
  return e;
}
function photoUrl(slot) { return `/.netlify/functions/invite-photo?slot=${encodeURIComponent(slot)}`; }

function openLightbox(slot) {
  const img = el('img', { src: photoUrl(slot), alt: '' });
  const close = () => overlay.remove();
  const overlay = el('div', { class: 'lightbox', onclick: close }, [
    el('button', { class: 'lightbox-close', onclick: close }, '✕'),
    img,
  ]);
  img.addEventListener('click', e => e.stopPropagation());
  document.body.appendChild(overlay);
}

function renderSlideshow(slides) {
  if (!slides || !slides.length) return null;
  let idx = 0;
  const track = el('div', { class: 'slide-track' }, slides.map(s => {
    if (s.type === 'photo') {
      const img = el('img', { src: photoUrl(s.slot), alt: '', onclick: () => openLightbox(s.slot) });
      img.onerror = () => { img.style.display = 'none'; };
      return el('div', { class: 'slide' }, [img]);
    }
    return el('div', { class: 'slide text-slide' }, [el('div', { class: 'slide-text' }, s.text || '')]);
  }));
  const prevBtn = el('button', { class: 'slide-nav prev', type: 'button' }, '‹');
  const nextBtn = el('button', { class: 'slide-nav next', type: 'button' }, '›');
  const counter = el('div', { class: 'slide-counter' }, `1 / ${slides.length}`);

  function update() {
    track.style.transform = `translateX(-${idx * 100}%)`;
    counter.textContent = `${idx + 1} / ${slides.length}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === slides.length - 1;
  }
  prevBtn.addEventListener('click', () => { if (idx > 0) { idx--; update(); } });
  nextBtn.addEventListener('click', () => { if (idx < slides.length - 1) { idx++; update(); } });
  update();

  const wrap = el('div', { class: 'slideshow' }, [track, prevBtn, nextBtn]);
  if (slides.length > 1) wrap.append(counter);
  return wrap;
}

function render(data) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (data.introText && data.introText.trim()) {
    app.append(el('div', { class: 'intro' }, data.introText));
  }
  const slideshow = renderSlideshow(data.slides);
  if (slideshow) {
    app.append(slideshow);
  } else if (!data.introText) {
    app.append(el('div', { class: 'empty' }, '아직 등록된 자료가 없습니다.'));
  }
}

function showEnvelope() {
  const persp = el('div', { class: 'sg-envelope-perspective' });
  const overlay = el('div', { class: 'sg-envelope-overlay' }, [
    el('div', { class: 'sg-env-fold' }),
    el('button', { class: 'sg-env-seal', type: 'button', 'aria-label': '자료 열기' }, '♥'),
    el('div', { class: 'sg-env-hint' }, '터치하여 열기'),
  ]);
  persp.append(overlay);
  persp.addEventListener('click', () => {
    overlay.classList.add('sg-env-opening');
    document.body.style.overflow = '';
    setTimeout(() => persp.remove(), 900);
  });
  document.body.style.overflow = 'hidden';
  document.body.appendChild(persp);
}

render({ introText: '', slides: [] });
showEnvelope();

fetch('/.netlify/functions/sanggyeonrye')
  .then(res => res.ok ? res.json() : null)
  .then(json => { if (json && json.data) render(json.data); })
  .catch(() => {});
</script>
</body>
</html>
