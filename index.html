<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소범 사이트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf5ee;
    --paper: #fffdfa;
    --panel: #ffffff;
    --panel-2: #fbeee1;
    --border: #ecdfce;
    --text: #4a3f33;
    --muted: #a5967e;
    --accent: #e0795c;
    --accent-soft: #f6d9c9;
    --sage: #8faa8b;
    --sage-soft: #dfe9dc;
    --lavender: #9b8bb4;
    --lavender-soft: #e6e0f0;
    --good: #6f9d6f;
    --warn: #d69a4c;
    --bad: #cc6b5c;
    --radius: 18px;
    --radius-sm: 12px;
    --font-head: 'Gowun Batang', 'Nanum Myeongjo', serif;
    --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle, rgba(224,121,92,0.10) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }
  a { color: var(--accent); }
  .app { display: flex; min-height: 100vh; align-items: flex-start; }

  /* Sidebar */
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    min-height: 100vh;
    background: var(--paper);
    border-right: 2px dashed var(--border);
    padding: 26px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .brand { padding: 2px 8px 14px; }
  .brand .emoji { font-size: 1.8rem; display: block; margin-bottom: 4px; }
  .brand h1 {
    font-family: var(--font-head);
    font-size: 1.4rem;
    margin: 0;
    color: var(--text);
  }
  .brand .sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-item {
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    transition: transform .12s, border-color .12s;
  }
  .plan-item:hover { border-color: var(--accent-soft); transform: translateX(2px); }
  .plan-item.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .plan-item .del {
    opacity: 0;
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 0.85rem; padding: 2px 4px; line-height: 1;
  }
  .plan-item:hover .del { opacity: 0.55; }
  .plan-item .del:hover { opacity: 1; }

  .btn {
    background: var(--panel);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    font-size: 0.86rem;
    font-weight: 700;
    font-family: var(--font-body);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { border-color: var(--border); }
  .btn.small { padding: 6px 12px; font-size: 0.78rem; }
  .btn.full { width: 100%; }

  .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 2px dashed var(--border); }
  .sidebar-foot input[type=file] { display: none; }

  .sync-status {
    font-size: 0.75rem; color: var(--muted); padding: 2px 8px 6px;
    display: flex; align-items: center; gap: 6px; font-weight: 600;
  }
  .sync-status .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0;
  }
  .sync-status.synced .dot { background: var(--good); }
  .sync-status.syncing .dot { background: var(--warn); }
  .sync-status.offline .dot { background: var(--bad); }

  .auth-gate {
    position: fixed; inset: 0; background: rgba(74, 63, 51, 0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .auth-box {
    background: var(--paper); border: 2px solid var(--border); border-radius: var(--radius);
    padding: 30px 28px; max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 18px 40px rgba(74,63,51,0.18);
  }
  .auth-box h2 { margin: 0 0 10px; font-family: var(--font-head); }
  .auth-box p { color: var(--muted); font-size: 0.88rem; margin: 0 0 16px; line-height: 1.5; }
  .auth-box input {
    width: 100%; padding: 11px 14px; border-radius: 999px; border: 2px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.95rem; margin-bottom: 14px;
    box-sizing: border-box; text-align: center; font-family: var(--font-body);
  }
  .auth-box input:focus { outline: none; border-color: var(--accent); }
  .auth-box .btn { width: 100%; }
  .auth-err { color: var(--bad); min-height: 1.2em; margin: 10px 0 0 !important; font-size: 0.82rem; }

  /* Main */
  .main { flex: 1; padding: 30px 40px 70px; max-width: 980px; }
  .plan-header { margin-bottom: 24px; }
  .plan-header .kicker { font-size: 0.78rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; }
  .plan-header input.plan-name {
    background: transparent; border: none; color: var(--text);
    font-family: var(--font-head);
    font-size: 2.1rem; font-weight: 700; outline: none;
    border-bottom: 3px solid transparent;
    padding: 2px 2px 4px;
    width: 100%;
  }
  .plan-header input.plan-name:focus { border-bottom-color: var(--accent); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .card {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .card .label { color: var(--muted); font-size: 0.78rem; font-weight: 700; margin-bottom: 6px; }
  .card .value { font-size: 1.4rem; font-weight: 800; font-family: var(--font-head); }
  .card .value.good { color: var(--good); }
  .card .value.warn { color: var(--warn); }
  .card .value.bad { color: var(--bad); }

  .progress-wrap {
    margin-bottom: 30px; background: var(--panel); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
  }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-top .pct { font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; color: var(--accent); }
  .progress-top .sched { font-size: 0.8rem; color: var(--muted); }
  .progress-bar {
    height: 12px; border-radius: 999px; background: var(--panel-2);
    overflow: hidden; border: 1px solid var(--border);
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--warn)); transition: width .3s; border-radius: 999px; }

  section.block { margin-bottom: 32px; }
  .block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .block-head h2 { font-family: var(--font-head); font-size: 1.2rem; margin: 0; display: flex; align-items: center; gap: 8px; }

  /* item list (cost items & deposits) */
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 2px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 10px 8px 14px;
  }
  .item-row input[type=text] { flex: 1; min-width: 0; }
  .item-row input[type=number] { width: 150px; text-align: right; }
  .item-row .amt-display { width: 120px; text-align: right; color: var(--muted); font-size: 0.78rem; flex-shrink: 0; }

  input[type=text], input[type=number], input[type=date] {
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: var(--text); padding: 7px 9px; font-size: 0.92rem; font-family: var(--font-body);
  }
  input[type=text]:hover, input[type=number]:hover, input[type=date]:hover { border-color: var(--border); }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus {
    border-color: var(--accent); outline: none; background: var(--panel-2);
  }
  .row-del {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem;
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  }
  .row-del:hover { color: #fff; background: var(--bad); }

  .list-total {
    display: flex; justify-content: space-between; padding: 10px 14px;
    font-weight: 800; font-family: var(--font-head); font-size: 1.05rem;
    border-top: 2px dashed var(--border); margin-top: 4px;
  }

  /* timeline (payments) */
  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 14px; }
  .tl-marker { display: flex; flex-direction: column; align-items: center; width: 26px; flex-shrink: 0; }
  .tl-dot {
    width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--border);
    background: var(--panel); flex-shrink: 0; cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: transparent; font-size: 0.7rem;
    font-weight: 900; margin-top: 8px;
  }
  .tl-item.done .tl-dot { background: var(--good); border-color: var(--good); color: #fff; }
  .tl-line { width: 2px; flex: 1; background: var(--border); margin: 2px 0; min-height: 8px; }
  .tl-item:last-child .tl-line { display: none; }
  .tl-content {
    flex: 1; background: var(--panel); border: 2px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .tl-item.done .tl-content { background: var(--sage-soft); border-color: var(--sage); }
  .tl-item.done .tl-content input { color: var(--good); }
  .tl-content input[type=date] { width: 140px; flex-shrink: 0; font-weight: 700; }
  .tl-content input[type=text] { flex: 1; min-width: 100px; }
  .tl-content input[type=number] { width: 130px; text-align: right; flex-shrink: 0; }
  .tl-content .amt-display { width: 110px; text-align: right; color: var(--muted); font-size: 0.76rem; flex-shrink: 0; }

  /* deposits grouped by contributor */
  .contrib-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .contrib-card { background: var(--panel); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px; min-width: 0; overflow: hidden; }
  .contrib-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; gap: 8px; }
  .contrib-head .name { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contrib-head .total { font-weight: 800; color: var(--lavender); flex-shrink: 0; }

  .deposit-row {
    background: var(--panel-2); border: 2px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .deposit-row .row-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .deposit-row .row-top input[type=text] { flex: 1; min-width: 0; font-weight: 700; }
  .deposit-row .row-bottom { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .deposit-row .row-bottom input.name-input { width: 60px; flex-shrink: 0; font-size: 0.78rem; color: var(--muted); }
  .deposit-row .row-bottom input[type=number] { flex: 1; min-width: 0; text-align: right; }

  .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 0.9rem; }
  footer.note {
    color: var(--muted); font-size: 0.8rem; margin-top: 40px; line-height: 1.6;
    background: var(--panel-2); border-radius: var(--radius-sm); padding: 12px 16px;
  }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-height: auto; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 2px dashed var(--border); align-items: center; }
    .brand { padding: 0 10px 0 0; }
    .plan-list { flex-direction: row; }
    .sidebar-foot { flex-direction: row; margin-top: 0; border-top: none; padding-top: 0; }
    .main { padding: 22px 18px; }
    .plan-header input.plan-name { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="emoji">🏡</span>
      <h1>소범 사이트</h1>
      <div class="sub">우리의 플랜 다이어리</div>
    </div>
    <div class="plan-list" id="planList"></div>
    <button class="btn primary small full" id="addPlanBtn">+ 새 플랜</button>
    <div class="sidebar-foot">
      <div class="sync-status" id="syncStatus">–</div>
      <button class="btn small full" id="exportBtn">내보내기 (Excel)</button>
      <button class="btn small full" id="importBtn">가져오기 (Excel)</button>
      <input type="file" id="importFile" accept=".xlsx,.xls">
      <button class="btn small ghost full" id="resetPasscodeBtn">🔑 비밀번호 재설정</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="authGate" class="auth-gate" style="display:none">
  <div class="auth-box">
    <h2>🔒 접근 비밀번호</h2>
    <p>이 플랜은 공유 비밀번호로 보호되어 있습니다. 지니 생일 🥳</p>
    <input id="authInput" type="password" placeholder="비밀번호" autocomplete="off">
    <button id="authSubmit" class="btn primary">확인</button>
    <p class="auth-err" id="authErr"></p>
  </div>
</div>

<script>
const STORAGE_KEY = 'myplans_v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';

function seedData() {
  return {
    version: 1,
    activePlanId: 'seed-cheongyak',
    plans: [
      {
        id: 'seed-cheongyak',
        name: '아파트 청약',
        costItems: [
          { id: uid(), label: '분양가', amount: 849400000 },
          { id: uid(), label: '중도금 대출 이자', amount: 32000000 },
          { id: uid(), label: '발코니 확장', amount: 22176000 },
          { id: uid(), label: '에어컨', amount: 6800000 },
        ],
        payments: [
          { id: uid(), date: '2026-05-29', label: '계약시 납부', amount: 12897600, done: true },
          { id: uid(), date: '2026-06-29', label: '중도금 1회', amount: 32470000, done: true },
          { id: uid(), date: '2026-09-28', label: '중도금(30%)', amount: 8692800, done: false },
          { id: uid(), date: '2029-10-01', label: '중도금+잔금 (예정)', amount: 856315600, done: false },
        ],
        deposits: [
          { id: uid(), contributor: '소진', label: '입금 1', amount: 5000000 },
          { id: uid(), contributor: '소진', label: '입금 2', amount: 1448800 },
          { id: uid(), contributor: '소진', label: '입금 3', amount: 20000000 },
          { id: uid(), contributor: '희범', label: '입금 1', amount: 5000000 },
          { id: uid(), contributor: '희범', label: '입금 2', amount: 1448800 },
          { id: uid(), contributor: '희범', label: '입금 3', amount: 20000000 },
        ],
      },
    ],
  };
}

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error(e); }
  return null;
}

let syncTimer = null;
function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  scheduleSync();
}

let state = loadLocalCache() || seedData();

/* ---------- Server sync (Netlify Function + Blobs) ---------- */
const API_URL = '/.netlify/functions/plans';
const PASSCODE_KEY = 'plan_passcode';
const getPasscode = () => localStorage.getItem(PASSCODE_KEY) || '';
const setPasscode = v => localStorage.setItem(PASSCODE_KEY, v);
const clearPasscode = () => localStorage.removeItem(PASSCODE_KEY);

function setSyncStatus(kind, text) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.className = 'sync-status ' + kind;
  const labels = { synced: '동기화됨', syncing: '동기화 중...', offline: text || '오프라인 (이 기기에만 저장)' };
  el.innerHTML = '<span class="dot"></span>' + (labels[kind] || text || '');
}

async function serverLoad() {
  const res = await fetch(API_URL, { headers: { 'x-plan-passcode': getPasscode() } });
  if (res.status === 401) { const e = new Error('unauthorized'); e.code = 401; throw e; }
  if (!res.ok) { const e = new Error('server error ' + res.status); e.code = res.status; throw e; }
  const json = await res.json();
  return json.data;
}
async function serverSave(data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-plan-passcode': getPasscode() },
    body: JSON.stringify(data),
  });
  if (res.status === 401) { const e = new Error('unauthorized'); e.code = 401; throw e; }
  if (!res.ok) throw new Error('save failed ' + res.status);
}

function scheduleSync() {
  clearTimeout(syncTimer);
  setSyncStatus('syncing');
  syncTimer = setTimeout(async () => {
    try {
      await serverSave(state);
      setSyncStatus('synced');
    } catch (e) {
      if (e.code === 401) {
        clearPasscode();
        setSyncStatus('offline', '비밀번호 오류 - 재설정 필요');
      } else {
        setSyncStatus('offline', '동기화 실패 (이 기기에만 저장됨)');
      }
    }
  }, 700);
}

function promptPasscode(errMsg) {
  return new Promise(resolve => {
    const gate = document.getElementById('authGate');
    const input = document.getElementById('authInput');
    const submitBtn = document.getElementById('authSubmit');
    const err = document.getElementById('authErr');
    err.textContent = errMsg || '';
    gate.style.display = 'flex';
    input.value = '';
    input.focus();
    const onSubmit = () => {
      const v = input.value.trim();
      if (!v) return;
      setPasscode(v);
      gate.style.display = 'none';
      submitBtn.removeEventListener('click', onSubmit);
      input.removeEventListener('keydown', onKey);
      resolve();
    };
    const onKey = e => { if (e.key === 'Enter') onSubmit(); };
    submitBtn.addEventListener('click', onSubmit);
    input.addEventListener('keydown', onKey);
  });
}

async function trySync() {
  if (!getPasscode()) await promptPasscode();
  setSyncStatus('syncing');
  try {
    const serverData = await serverLoad();
    if (serverData) {
      state = serverData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } else {
      await serverSave(state);
    }
    setSyncStatus('synced');
    render();
  } catch (e) {
    if (e.code === 401) {
      clearPasscode();
      await promptPasscode('비밀번호가 올바르지 않습니다. 다시 입력하세요.');
      return trySync();
    }
    setSyncStatus('offline', '서버에 연결할 수 없어 이 기기에만 저장됩니다');
  }
}

function resetPasscode() {
  clearPasscode();
  trySync();
}

function getActivePlan() {
  return state.plans.find(p => p.id === state.activePlanId) || state.plans[0];
}

function persistAndRender() { save(state); render(); }

/* ---------- Actions ---------- */
function addPlan() {
  const name = prompt('새 플랜 이름을 입력하세요', '새 플랜');
  if (!name) return;
  const plan = { id: uid(), name, costItems: [], payments: [], deposits: [] };
  state.plans.push(plan);
  state.activePlanId = plan.id;
  persistAndRender();
}
function deletePlan(id, evt) {
  evt.stopPropagation();
  if (!confirm('이 플랜을 삭제할까요? 되돌릴 수 없습니다.')) return;
  state.plans = state.plans.filter(p => p.id !== id);
  if (state.activePlanId === id) {
    state.activePlanId = state.plans[0] ? state.plans[0].id : null;
  }
  persistAndRender();
}
function selectPlan(id) { state.activePlanId = id; persistAndRender(); }
function renamePlan(id, name) {
  const plan = state.plans.find(p => p.id === id);
  if (plan) { plan.name = name; save(state); renderSidebar(); }
}

function addCostItem() {
  getActivePlan().costItems.push({ id: uid(), label: '', amount: 0 });
  persistAndRender();
}
function addPayment() {
  getActivePlan().payments.push({ id: uid(), date: '', label: '', amount: 0, done: false });
  persistAndRender();
}
function addDeposit() {
  getActivePlan().deposits.push({ id: uid(), contributor: '', label: '', amount: 0 });
  persistAndRender();
}
function removeItem(arr, id) {
  const plan = getActivePlan();
  plan[arr] = plan[arr].filter(x => x.id !== id);
  persistAndRender();
}
function updateItem(arr, id, field, value) {
  const plan = getActivePlan();
  const item = plan[arr].find(x => x.id === id);
  if (!item) return;
  item[field] = field === 'amount' ? (Number(value) || 0) : field === 'done' ? value : value;
  save(state);
  renderMain();
}

function normalizeDate(v) {
  if (v === undefined || v === null || v === '') return '';
  if (v instanceof Date) {
    const mm = String(v.getMonth() + 1).padStart(2, '0');
    const dd = String(v.getDate()).padStart(2, '0');
    return `${v.getFullYear()}-${mm}-${dd}`;
  }
  if (typeof v === 'number' && window.XLSX && XLSX.SSF) {
    const d = XLSX.SSF.parse_date_code(v);
    if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return s;
}
function isDoneValue(v) {
  if (v === true) return true;
  if (v === undefined || v === null) return false;
  const s = String(v).trim().toLowerCase();
  return ['예', 'o', 'v', 'true', '1', '완료', 'y', 'yes'].includes(s);
}

function exportExcel() {
  const wb = XLSX.utils.book_new();
  const planListRows = state.plans.map(p => ({ 플랜명: p.name }));
  const costRows = [];
  const paymentRows = [];
  const depositRows = [];
  state.plans.forEach(p => {
    p.costItems.forEach(c => costRows.push({ 플랜명: p.name, 항목: c.label, 금액: c.amount }));
    p.payments.forEach(pay => paymentRows.push({ 플랜명: p.name, 완료: pay.done ? '예' : '', 날짜: pay.date || '', 항목: pay.label, 금액: pay.amount }));
    p.deposits.forEach(d => depositRows.push({ 플랜명: p.name, 이름: d.contributor, 내역: d.label, 금액: d.amount }));
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planListRows), '플랜목록');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(costRows), '비용항목');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentRows), '납부일정');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(depositRows), '입금현황');
  XLSX.writeFile(wb, 'myplans-export.xlsx');
}

function importExcel(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array', cellDates: true });
      const sheet = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : [];
      const planListRows = sheet('플랜목록');
      const costRows = sheet('비용항목');
      const paymentRows = sheet('납부일정');
      const depositRows = sheet('입금현황');
      if (!planListRows.length && !costRows.length && !paymentRows.length && !depositRows.length) {
        throw new Error('empty');
      }

      const planNames = [];
      const addName = name => { if (name && !planNames.includes(name)) planNames.push(name); };
      planListRows.forEach(r => addName(r['플랜명']));
      costRows.forEach(r => addName(r['플랜명']));
      paymentRows.forEach(r => addName(r['플랜명']));
      depositRows.forEach(r => addName(r['플랜명']));

      const plans = planNames.map(name => ({
        id: uid(),
        name,
        costItems: costRows.filter(r => r['플랜명'] === name).map(r => ({
          id: uid(), label: r['항목'] || '', amount: Number(r['금액']) || 0,
        })),
        payments: paymentRows.filter(r => r['플랜명'] === name).map(r => ({
          id: uid(), date: normalizeDate(r['날짜']), label: r['항목'] || '',
          amount: Number(r['금액']) || 0, done: isDoneValue(r['완료']),
        })),
        deposits: depositRows.filter(r => r['플랜명'] === name).map(r => ({
          id: uid(), contributor: r['이름'] || '', label: r['내역'] || '', amount: Number(r['금액']) || 0,
        })),
      }));

      if (!plans.length) throw new Error('no plans');
      state = { version: 1, activePlanId: plans[0].id, plans };
      persistAndRender();
    } catch (e) {
      console.error(e);
      alert('엑셀 파일을 읽는 중 문제가 발생했습니다. "내보내기(Excel)"로 받은 형식과 같은 파일인지 확인해주세요.');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Render ---------- */
function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === 'class') e.className = v;
    else if (k === 'checked') e.checked = !!v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) e.append(c);
  return e;
}

function renderSidebar() {
  const list = document.getElementById('planList');
  list.innerHTML = '';
  state.plans.forEach(p => {
    const item = el('div', {
      class: 'plan-item' + (p.id === state.activePlanId ? ' active' : ''),
      onclick: () => selectPlan(p.id),
    }, [
      el('span', {}, p.name || '(이름 없음)'),
      el('button', { class: 'del', title: '삭제', onclick: (e) => deletePlan(p.id, e) }, '✕'),
    ]);
    list.append(item);
  });
}

function calcPlan(plan) {
  const totalCost = plan.costItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const totalPaid = plan.payments.filter(x => x.done).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const totalScheduled = plan.payments.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const totalDeposits = plan.deposits.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const remaining = totalCost - totalPaid;
  const balance = totalDeposits - totalPaid;
  const progressPct = totalCost > 0 ? Math.min(100, (totalPaid / totalCost) * 100) : 0;
  const perContributor = {};
  plan.deposits.forEach(d => {
    const key = d.contributor || '(미지정)';
    perContributor[key] = (perContributor[key] || 0) + (Number(d.amount) || 0);
  });
  return { totalCost, totalPaid, totalScheduled, totalDeposits, remaining, balance, progressPct, perContributor };
}

function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const plan = getActivePlan();
  if (!plan) {
    main.append(el('div', { class: 'empty' }, '플랜이 없습니다. 왼쪽에서 "+ 새 플랜"을 눌러 시작하세요.'));
    return;
  }
  const calc = calcPlan(plan);

  // Header
  const nameInput = el('input', {
    class: 'plan-name', type: 'text', value: plan.name,
    oninput: (e) => renamePlan(plan.id, e.target.value),
  });
  main.append(el('div', { class: 'plan-header' }, [
    el('div', { class: 'kicker' }, '📖 나의 플랜'),
    nameInput,
  ]));

  // Cards
  const cards = el('div', { class: 'cards' }, [
    el('div', { class: 'card' }, [
      el('div', { class: 'label' }, '총 필요 금액'),
      el('div', { class: 'value' }, won(calc.totalCost)),
    ]),
    el('div', { class: 'card' }, [
      el('div', { class: 'label' }, '납부 완료'),
      el('div', { class: 'value good' }, won(calc.totalPaid)),
    ]),
    el('div', { class: 'card' }, [
      el('div', { class: 'label' }, '남은 금액'),
      el('div', { class: 'value warn' }, won(calc.remaining)),
    ]),
    el('div', { class: 'card' }, [
      el('div', { class: 'label' }, '현재 잔액 (입금 - 납부)'),
      el('div', { class: 'value ' + (calc.balance >= 0 ? 'good' : 'bad') }, won(calc.balance)),
    ]),
  ]);
  main.append(cards);

  // Progress
  main.append(el('div', { class: 'progress-wrap' }, [
    el('div', { class: 'progress-top' }, [
      el('span', { class: 'pct' }, `진행률 ${calc.progressPct.toFixed(1)}%`),
      el('span', { class: 'sched' }, `일정 총액 ${won(calc.totalScheduled)}`),
    ]),
    el('div', { class: 'progress-bar' }, [
      el('div', { class: 'progress-fill', style: `width:${calc.progressPct.toFixed(1)}%` }),
    ]),
  ]));

  main.append(renderCostSection(plan));
  main.append(renderPaymentSection(plan));
  main.append(renderDepositSection(plan, calc));

  main.append(el('footer', { class: 'note' },
    '비밀번호를 아는 사람끼리 서버를 통해 데이터가 자동 동기화됩니다. 별도 백업이 필요하면 "내보내기(Excel)"를 사용하세요.'));
}

function renderCostSection(plan) {
  const rows = plan.costItems.map(item => el('div', { class: 'item-row' }, [
    el('input', {
      type: 'text', value: item.label, placeholder: '항목명',
      oninput: e => updateItem('costItems', item.id, 'label', e.target.value),
    }),
    el('input', {
      type: 'number', value: item.amount, placeholder: '0',
      oninput: e => updateItem('costItems', item.id, 'amount', e.target.value),
    }),
    el('span', { class: 'amt-display' }, won(item.amount)),
    el('button', { class: 'row-del', onclick: () => removeItem('costItems', item.id) }, '✕'),
  ]));
  const total = plan.costItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);

  return el('section', { class: 'block' }, [
    el('div', { class: 'block-head' }, [
      el('h2', {}, '💰 비용 항목'),
      el('button', { class: 'btn small', onclick: addCostItem }, '+ 항목 추가'),
    ]),
    el('div', { class: 'item-list' },
      rows.length ? rows : [el('div', { class: 'empty' }, '항목이 없습니다.')]),
    el('div', { class: 'list-total' }, [el('span', {}, '합계'), el('span', {}, won(total))]),
  ]);
}

function renderPaymentSection(plan) {
  const sorted = [...plan.payments].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const items = sorted.map(item => el('div', { class: 'tl-item' + (item.done ? ' done' : '') }, [
    el('div', { class: 'tl-marker' }, [
      el('button', {
        class: 'tl-dot',
        title: item.done ? '완료 취소' : '완료로 표시',
        onclick: () => updateItem('payments', item.id, 'done', !item.done),
      }, item.done ? '✓' : ''),
      el('div', { class: 'tl-line' }),
    ]),
    el('div', { class: 'tl-content' }, [
      el('input', {
        type: 'date', value: item.date || '',
        oninput: e => updateItem('payments', item.id, 'date', e.target.value),
      }),
      el('input', {
        type: 'text', value: item.label, placeholder: '납부 항목',
        oninput: e => updateItem('payments', item.id, 'label', e.target.value),
      }),
      el('input', {
        type: 'number', value: item.amount, placeholder: '0',
        oninput: e => updateItem('payments', item.id, 'amount', e.target.value),
      }),
      el('span', { class: 'amt-display' }, won(item.amount)),
      el('button', { class: 'row-del', onclick: () => removeItem('payments', item.id) }, '✕'),
    ]),
  ]));
  const total = plan.payments.reduce((s, x) => s + (Number(x.amount) || 0), 0);

  return el('section', { class: 'block' }, [
    el('div', { class: 'block-head' }, [
      el('h2', {}, '📅 납부 일정'),
      el('button', { class: 'btn small', onclick: addPayment }, '+ 일정 추가'),
    ]),
    el('div', { class: 'timeline' },
      items.length ? items : [el('div', { class: 'empty' }, '납부 일정이 없습니다.')]),
    el('div', { class: 'list-total' }, [el('span', {}, '합계'), el('span', {}, won(total))]),
  ]);
}

function renderDepositSection(plan, calc) {
  const groups = {};
  const order = [];
  plan.deposits.forEach(d => {
    const key = d.contributor && d.contributor.trim() ? d.contributor : '(이름 미입력)';
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(d);
  });

  const groupCards = order.map(name => {
    const rows = groups[name].map(item => el('div', { class: 'deposit-row' }, [
      el('div', { class: 'row-top' }, [
        el('input', {
          type: 'text', value: item.label, placeholder: '내역',
          oninput: e => updateItem('deposits', item.id, 'label', e.target.value),
        }),
        el('button', { class: 'row-del', onclick: () => removeItem('deposits', item.id) }, '✕'),
      ]),
      el('div', { class: 'row-bottom' }, [
        el('input', {
          class: 'name-input', type: 'text', value: item.contributor, placeholder: '이름',
          oninput: e => updateItem('deposits', item.id, 'contributor', e.target.value),
        }),
        el('input', {
          type: 'number', value: item.amount, placeholder: '0',
          oninput: e => updateItem('deposits', item.id, 'amount', e.target.value),
        }),
      ]),
    ]));
    const subtotal = groups[name].reduce((s, x) => s + (Number(x.amount) || 0), 0);
    return el('div', { class: 'contrib-card' }, [
      el('div', { class: 'contrib-head' }, [
        el('span', { class: 'name' }, '👤 ' + name),
        el('span', { class: 'total' }, won(subtotal)),
      ]),
      el('div', { class: 'item-list' }, rows),
    ]);
  });

  const total = plan.deposits.reduce((s, x) => s + (Number(x.amount) || 0), 0);

  return el('section', { class: 'block' }, [
    el('div', { class: 'block-head' }, [
      el('h2', {}, '🏦 입금 현황'),
      el('button', { class: 'btn small', onclick: addDeposit }, '+ 입금 추가'),
    ]),
    groupCards.length
      ? el('div', { class: 'contrib-grid' }, groupCards)
      : el('div', { class: 'empty' }, '입금 내역이 없습니다.'),
    el('div', { class: 'list-total' }, [el('span', {}, '전체 합계'), el('span', {}, won(total))]),
  ]);
}

function render() { renderSidebar(); renderMain(); }

document.getElementById('addPlanBtn').addEventListener('click', addPlan);
document.getElementById('exportBtn').addEventListener('click', exportExcel);
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e) => {
  if (e.target.files[0]) importExcel(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('resetPasscodeBtn').addEventListener('click', resetPasscode);

render();
trySync();
</script>
